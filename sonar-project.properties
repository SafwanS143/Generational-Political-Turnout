# SonarQube project configuration for the Elections Canada website
sonar.projectKey=elections-canada-website
sonar.projectName=Elections Canada Website
sonar.projectVersion=1.0

# Source / test layout
sonar.sources=backend/app,backend/data_processing,frontend/src
sonar.tests=backend/tests

# Language-specific settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions: dependencies, build artefacts, large binary/data assets, generated files
sonar.exclusions=**/venv/**,**/node_modules/**,**/.next/**,**/out/**,**/__pycache__/**,**/*.whl,**/migrations/**,frontend/public/**,data/**,institution_map.html
sonar.test.exclusions=**/venv/**,**/node_modules/**
sonar.coverage.exclusions=backend/tests/**,backend/data_processing/**,backend/app/load_to_db.py,backend/app/create_tables.py,frontend/**
